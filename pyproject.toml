[project]
name = "stock-index-finder"
version = "0.1.0"
description = "查詢一檔（或多檔）股票被納入哪些指數、追蹤該指數的 ETF，以及在指數中的權重"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "truststore>=0.9",
    "pyodbc>=5.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
dev = ["pytest>=8.0"]

[project.scripts]
indexfinder = "indexfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
