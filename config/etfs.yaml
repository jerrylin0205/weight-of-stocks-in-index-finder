# ETF → 指數 對應表。
#
# 每列欄位：
#   ticker          ETF 代號（必填）
#   name            顯示名稱
#   market          US / TW
#   issuer          發行商
#   index           指數名稱 —— 這是查詢結果的分組單位；多檔 ETF 可對到同一個 index
#   index_provider  指數編製公司
#   source          抓取來源，對應 sources.REGISTRY：
#                     ishares  -> params.product_id（純數字，iShares 產品頁網址中的 id）
#                     ssga     -> params.ssga_ticker（小寫，預設同 ticker）
#                     invesco  -> params.invesco_ticker（預設同 ticker）
#                     yuanta   -> params.fund_id（預設同 ticker）
#                     manual   -> 讀 data/manual/<TICKER>.csv
#   primary         true = 該指數的「代表性 ETF」，查詢權重以它的持股為準
#
# 加一檔美股 iShares ETF：到 ishares.com 找到產品頁，網址 /products/<id>/... 的 <id> 就是 product_id。

etfs:
  # ── 美股・大盤 / 綜合 ────────────────────────────────────────────
  - ticker: IVV
    name: iShares Core S&P 500 ETF
    market: US
    issuer: BlackRock
    index: S&P 500
    index_provider: S&P Dow Jones Indices
    source: ishares
    params: { product_id: 239726, expect_name: "S&P 500" }
    primary: true
  - ticker: SPY
    name: SPDR S&P 500 ETF Trust
    market: US
    issuer: State Street
