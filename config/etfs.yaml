  - ticker: QQQ
    name: Invesco QQQ Trust
    market: US
    issuer: Invesco
    index: Nasdaq-100 Index
    index_provider: Nasdaq
    # Invesco 官方下載端點會擋資料中心 IP（見 sources/invesco.py）；改用
    # Alpha Vantage ETF_PROFILE，QQQ 剛好在他們的 demo key 白名單裡可以直接用。
    # 想換成有自己 key 的一般用法：加 params.av_key，或設環境變數 ALPHAVANTAGE_API_KEY。
    source: alphavantage
    params: { av_symbol: QQQ }
    primary: true

